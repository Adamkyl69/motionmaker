<!doctype html>
<meta charset="utf-8">
<title>__TEXT__</title>
<!-- Starter: a borrowed SVG figure (Open Peeps / Humaaans / unDraw / your own) given life with idle motion, plus a caption. Frame-exact: pure function of the frame number.
     Parts are found by id: BODY + HEAD (Open Peeps from kit.mjs) or HEAD + TORSO + BOTTOM (Humaaans from kit.mjs). Any other SVG animates as one piece.
     The file lives in assets/ and must be recorded with ledger.mjs before it ships. Needs tokens.js. -->
<style>
  html,body{margin:0;background:__BG__}
  #stage{position:relative;width:__W__px;height:__H__px;overflow:hidden;background:__BG__}
  #art{position:absolute;display:flex;align-items:flex-end;justify-content:center}   /* no CSS transform/opacity on #art: the pop and fade happen inside the SVG so the raster never depends on which frame was drawn before */
  #art svg{height:100%;width:auto;max-width:100%;overflow:visible}
  #cap{position:absolute;left:0;right:0;text-align:center;white-space:pre;font-weight:__WEIGHT__;color:__FG__;font-family:__FONT__;letter-spacing:__TRACK__em;line-height:1}
  #cap span{display:inline-block}
  #bar{position:absolute;background:__ACCENT__;transform-origin:left center}
  #ground{position:absolute;background:__ACCENT__;opacity:.16;border-radius:50%}
</style>
<div id="stage"><div id="ground"></div><div id="art"></div><div id="cap"></div><div id="bar"></div></div>
<script src="tokens.js"></script>
<script>
const CONFIG = { text:"__TEXT__", w:__W__, h:__H__, fps:__FPS__, frames:__N__, asset:"__ASSETFILE__" };
const TOKENS = { artIn:18, popFrom:0.9, capDelay:10, capIn:__INF__, capStagger:__STAGGER__, exitStart:__EXIT__, outF:10,
                 breathSec:__IDLESEC__, breath:0.014, bobPx:0.006, swayDeg:1.2, artBox:{ x:0.15, y:0.05, w:0.7, h:0.70 },
                 capPct:Math.min(__FONTPCT__, 0.06), capTopPct:0.81, barTopPct:0.91, barWPct:0.3, barHPct:0.012 };
const { clamp, EASE } = Motion, N = CONFIG.frames, stage = document.getElementById("stage"), art = document.getElementById("art"), cap = document.getElementById("cap"), bar = document.getElementById("bar"), ground = document.getElementById("ground");
const A = TOKENS.artBox; Object.assign(art.style, { left:CONFIG.w*A.x+"px", top:CONFIG.h*A.y+"px", width:CONFIG.w*A.w+"px", height:CONFIG.h*A.h+"px" });
Object.assign(ground.style, { left:CONFIG.w*0.32+"px", width:CONFIG.w*0.36+"px", top:CONFIG.h*(A.y+A.h)-CONFIG.h*0.012+"px", height:CONFIG.h*0.024+"px" });
cap.style.fontSize = CONFIG.w*TOKENS.capPct+"px"; cap.style.top = CONFIG.h*TOKENS.capTopPct+"px";
Object.assign(bar.style, { left:CONFIG.w*(1-TOKENS.barWPct)/2+"px", top:CONFIG.h*TOKENS.barTopPct+"px", width:CONFIG.w*TOKENS.barWPct+"px", height:Math.max(3,CONFIG.h*TOKENS.barHPct)+"px" });
const letters = CONFIG.text === "-" ? [] : [...CONFIG.text].map(ch => { const s=document.createElement("span"); s.textContent=ch; cap.appendChild(s); return s; });

// Wrap a part in a new <g> we can transform without touching the part's own transform attribute (the kits position parts with it).
const NS = "http://www.w3.org/2000/svg", rig = {};
function wrap(el) { const w = document.createElementNS(NS, "g"); el.parentNode.insertBefore(w, el); w.appendChild(el); const b = w.getBBox(); return { w, x:b.x, y:b.y, bw:b.width, bh:b.height }; }
window.ready = fetch(CONFIG.asset).then(r => r.text()).then(txt => {
  art.innerHTML = txt; const svg = art.querySelector("svg"); svg.removeAttribute("width"); svg.removeAttribute("height");
  const pick = id => svg.querySelector("#" + id);
  rig.mode = pick("BODY") && pick("HEAD") ? "peep" : pick("TORSO") && pick("HEAD") ? "human" : "whole";
  if (rig.mode === "peep") { rig.body = wrap(pick("BODY")); rig.head = wrap(pick("HEAD")); }
  else if (rig.mode === "human") { rig.torso = wrap(pick("TORSO")); rig.head = wrap(pick("HEAD")); }
  else rig.whole = wrap(svg.firstElementChild ? svg.firstElementChild : svg);
  const all = document.createElementNS(NS, "g"); while (svg.firstChild) all.appendChild(svg.firstChild); svg.appendChild(all);   // pop + fade apply to this outer group
  const b = all.getBBox(); rig.pop = { w: all, x: b.x, y: b.y, bw: b.width, bh: b.height }; rig.svg = svg;
  renderFrame(0);
});
const tr = (r, tx, ty, rot, sy, sx = 1) => r.w.setAttribute("transform", `translate(${r.x + r.bw/2} ${r.y + r.bh}) translate(${tx} ${ty}) rotate(${rot}) scale(${sx} ${sy}) translate(${-(r.x + r.bw/2)} ${-(r.y + r.bh)})`);

function renderFrame(f){
  const t = f / CONFIG.fps, ph = 2*Math.PI*t / TOKENS.breathSec, br = Math.sin(ph), bob = Math.sin(ph - 0.9), sway = Math.sin(ph/2 + 0.6);   // whole periods fit the loop, so idle motion is seamless
  if (rig.mode === "peep" || rig.mode === "human") {
    const base = rig.mode === "peep" ? rig.body : rig.torso, sy = 1 + TOKENS.breath*br, lift = -(sy - 1) * base.bh;
    tr(base, 0, 0, 0, sy);
    tr(rig.head, 0, lift + bob*TOKENS.bobPx*base.bh, TOKENS.swayDeg*sway, 1);
  } else if (rig.whole) tr(rig.whole, 0, 0, 0, 1 + TOKENS.breath*br*0.6);
  const aIn = EASE.pop(clamp(f / TOKENS.artIn)), aOut = EASE.in(clamp((f - TOKENS.exitStart) / TOKENS.outF)), vis = clamp(f / (TOKENS.artIn*0.5)) * (1 - aOut);
  const pop = (TOKENS.popFrom + (1-TOKENS.popFrom)*aIn) * (1 - 0.04*aOut); if (rig.pop) { tr(rig.pop, 0, 0, 0, pop, pop); rig.svg.setAttribute("opacity", Math.min(vis, 0.999));   /* never exactly 1: the raster path must not change when the fade finishes */ } ground.style.opacity = 0.16 * vis;
  letters.forEach((el, i) => {
    const inP = EASE.out(clamp((f - TOKENS.capDelay - i*TOKENS.capStagger) / TOKENS.capIn)), outP = EASE.in(clamp((f - TOKENS.exitStart - i*0.5) / TOKENS.outF));
    el.style.transform = `translateY(${((1-inP) - outP) * CONFIG.h*0.03}px)`; el.style.opacity = (inP>0 && outP<1) ? 1 : 0;
  });
  const bi = EASE.out(clamp((f - TOKENS.capDelay) / 24)), bo = EASE.in(clamp((f - TOKENS.exitStart) / TOKENS.outF));
  bar.style.transform = `scaleX(${bi - bo})`;
}
window.renderFrame = renderFrame;
const q = new URLSearchParams(location.search).get("t");
if (q !== null) window.ready.then(() => renderFrame(Math.round(parseFloat(q)*CONFIG.fps)));
else window.ready.then(() => { let s=null; (function L(ts){ s??=ts; renderFrame(Math.floor((ts-s)/1000*CONFIG.fps)%N); requestAnimationFrame(L); })(0); }); // live preview only
</script>
