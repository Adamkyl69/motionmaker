<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<title>__TEXT__</title>
<!-- Starter: an equation revealed term by term (KaTeX, typeset ahead of time by motionmaker-libs/scripts/math.mjs into math/eq.html), then the part
     wrapped in \htmlClass{hl}{...} takes the accent colour and gets an underline. Caption below. Frame-exact. Needs tokens.js. -->
<style>
  html,body{margin:0;background:__BG__}
  #stage{position:relative;width:__W__px;height:__H__px;overflow:hidden;background:__BG__}
  #eq{position:absolute;left:0;right:0;color:__FG__;text-align:center}
  #eq .katex-display{margin:0}
  #eq .hl{transition:none}
  #under{position:absolute;background:__ACCENT__;transform-origin:left center}
  #cap{position:absolute;left:0;right:0;text-align:center;white-space:pre;font-weight:__WEIGHT__;color:__FG__;font-family:__FONT__;letter-spacing:__TRACK__em;line-height:1}
  #cap span{display:inline-block}
</style>
<div id="stage"><div id="eq"></div><div id="under"></div><div id="cap"></div></div>
<script src="tokens.js"></script>
<script>
const CONFIG = { text:"__TEXT__", w:__W__, h:__H__, fps:__FPS__, frames:__N__, accent:"__ACCENT__", fg:"__FG__" };
const TOKENS = { start:8, stagger:4, termIn:12, hlAfter:10, hlIn:12, capDelay:10, capIn:__INF__, capStagger:__STAGGER__, exitStart:__EXIT__, outF:10,
                 maxEqWPct:0.84, maxEqHPct:0.36, eqCenterPct:0.44, capPct:Math.min(__FONTPCT__, 0.05), capTopPct:0.76 };
const { clamp, EASE } = Motion, N = CONFIG.frames, $ = id => document.getElementById(id), eq = $("eq"), under = $("under"), cap = $("cap");
cap.style.fontSize = CONFIG.w*TOKENS.capPct+"px"; cap.style.top = CONFIG.h*TOKENS.capTopPct+"px";
const letters = CONFIG.text === "-" ? [] : [...CONFIG.text].map(ch => { const s=document.createElement("span"); s.textContent=ch; cap.appendChild(s); return s; });
let terms = [], hls = [], hlBox = null, revealEnd = 0;
window.ready = fetch("math/eq.html").then(r => r.text()).then(html => { eq.innerHTML = html; return document.fonts.ready; }).then(() => Promise.all([...document.fonts].map(f => f.status === "unloaded" ? f.load().catch(() => 0) : 0))).then(() => {
  // size: scale the typeset equation to fit the box (KaTeX sizes in em)
  // measure the typeset lines themselves: .katex is a block as wide as the frame whatever the font size
  // (KaTeX names its line boxes .base, or .katex-base in newer versions). Terms are revealed one by one as inline-blocks: give them that
  // layout BEFORE measuring, or the fit and the highlight underline are measured on a layout the frames never show.
  const BASE = ".katex-html > .base, .katex-html > .katex-base";
  terms = [...eq.querySelectorAll(BASE)].flatMap(b => [...b.children].filter(c => !c.classList.contains("strut") && !c.classList.contains("katex-strut")));
  terms.forEach(t => { t.style.display = "inline-block"; });
  eq.style.fontSize = "100px"; const rs = [...eq.querySelectorAll(BASE)].map(b => b.getBoundingClientRect());
  const r = { width: Math.max(...rs.map(x => x.right)) - Math.min(...rs.map(x => x.left)), height: Math.max(...rs.map(x => x.bottom)) - Math.min(...rs.map(x => x.top)) };
  const k = Math.min(CONFIG.w*TOKENS.maxEqWPct / r.width, CONFIG.h*TOKENS.maxEqHPct / r.height); eq.style.fontSize = 100*k + "px";
  const r2 = eq.getBoundingClientRect(); eq.style.top = CONFIG.h*TOKENS.eqCenterPct - r2.height/2 + "px";
  // terms = top-level atoms of each .base line, revealed in reading order
  hls = [...eq.querySelectorAll(".hl")]; revealEnd = TOKENS.start + terms.length*TOKENS.stagger + TOKENS.termIn;
  if (hls.length) { const s = eq.getBoundingClientRect(), bs = hls.map(h => h.getBoundingClientRect()), st = $("stage").getBoundingClientRect();
    hlBox = { l: Math.min(...bs.map(b => b.left)) - st.left, r: Math.max(...bs.map(b => b.right)) - st.left, b: Math.max(...bs.map(b => b.bottom)) - st.top };
    Object.assign(under.style, { left: hlBox.l+"px", width: hlBox.r-hlBox.l+"px", top: hlBox.b + CONFIG.h*0.012+"px", height: Math.max(3, CONFIG.h*0.008)+"px" }); }
  renderFrame(0);
});
const mix = (a, b, t) => { const p = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16)), A = p(a), B = p(b); return `rgb(${A.map((v,i) => Math.round(v+(B[i]-v)*t)).join(",")})`; };
function renderFrame(f) {
  const out = EASE.in(clamp((f - TOKENS.exitStart)/TOKENS.outF));
  terms.forEach((t, i) => { const p = EASE.out(clamp((f - TOKENS.start - i*TOKENS.stagger)/TOKENS.termIn)); t.style.opacity = p*(1-out); t.style.transform = `translateY(${(1-p)*0.25}em)`; });
  const h = EASE.out(clamp((f - revealEnd - TOKENS.hlAfter)/TOKENS.hlIn)); hls.forEach(el => el.style.color = mix(CONFIG.fg, CONFIG.accent, h));
  under.style.transform = `scaleX(${hlBox ? EASE.move(clamp((f - revealEnd - TOKENS.hlAfter)/(TOKENS.hlIn*1.5))) * (1 - out) : 0})`;
  letters.forEach((el, i) => { const a = EASE.out(clamp((f - revealEnd - TOKENS.capDelay - i*TOKENS.capStagger)/TOKENS.capIn)), b = EASE.in(clamp((f-TOKENS.exitStart-i*0.5)/TOKENS.outF));
    el.style.transform = `translateY(${((1-a)-b)*CONFIG.h*0.03}px)`; el.style.opacity = (a>0 && b<1) ? 1 : 0; });
}
window.renderFrame = renderFrame;
const q = new URLSearchParams(location.search).get("t");
if (q !== null) window.ready.then(() => renderFrame(Math.round(parseFloat(q)*CONFIG.fps)));
else window.ready.then(() => { let s=null; (function L(ts){ s??=ts; renderFrame(Math.floor((ts-s)/1000*CONFIG.fps)%N); requestAnimationFrame(L); })(0); }); // live preview only
</script>
