<!-- Starter: a 3D STYLE scene (Three.js r160), one of five looks: cgi (stylised 3D CGI: soft, rounded, studio-lit), toon (cel-shaded 3D: stepped

     on threes with a small jitter each drawing), lowpoly (faceted, flat-shaded). A toy-like character (ours) waves and bounces on a little set; the
     headline lands on a 2D layer above. Frame-exact: renderFrame(f) is a pure function of f; any randomness is seeded. Swap the character for the

  const a = i / (ST === "glass" ? 6 : 4) * Math.PI * 2 + 0.5, rad = ST === "glass" ? 1.7 + r() * 0.4 : 1.75; m.position.set(Math.cos(a) * rad, ST === "glass" ? 0.6 + r() * 1.6 : 0.4, Math.sin(a) * rad * 0.6 - 0.3); props.push({ m, a, y: m.position.y, ph: r() * 6 });
}
// the character (ours): a rounded body, a big head, small arms and feet, two eyes with highlights
const hero = new THREE.Group(); set.add(hero);
const body = add(new THREE.CapsuleGeometry(0.42, 0.55, 12, seg[0]), mat(LOOK.body), hero); body.position.y = 0.75;
const head = add(new THREE.SphereGeometry(0.52, ...seg), mat(LOOK.head), hero); head.position.y = 1.62;
const eyeM = new THREE.MeshBasicMaterial({ color: "#1b1424" }), hiM = new THREE.MeshBasicMaterial({ color: "#ffffff" });
for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 12), eyeM); e.position.set(0.17 * s, 1.68, 0.47); hero.add(e); const h = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), hiM); h.position.set(0.17 * s + 0.025, 1.7, 0.53); hero.add(h); }
const cheekM = new THREE.MeshBasicMaterial({ color: "#ff8a8a", transparent: true, opacity: 0.55 }); for (const s of [-1, 1]) { const c = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 8), cheekM); c.scale.set(1, 0.6, 0.3); c.position.set(0.3 * s, 1.55, 0.44); hero.add(c); }
