<!doctype html>
<meta charset="utf-8">
<title>__TEXT__</title>
<!-- Starter: kinetic title loop. Frame-exact: every pixel is a pure function of the frame number.
     Edit CONFIG/TOKENS, or rewrite renderFrame for other shot types. Needs tokens.js next to this file. -->
<style>
  html,body{margin:0;background:__BG__}
  #stage{position:relative;width:__W__px;height:__H__px;overflow:hidden;background:__BG__}
  #title{position:absolute;left:0;right:0;text-align:center;white-space:pre;font-weight:800;color:__FG__;
    font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:-0.04em;line-height:1}
  #title span{display:inline-block;will-change:transform}
  #bar{position:absolute;background:__ACCENT__;transform-origin:left center}
</style>
<div id="stage"><div id="title"></div><div id="bar"></div></div>
<script src="tokens.js"></script>
<script>
const CONFIG = { text:"__TEXT__", w:__W__, h:__H__, fps:__FPS__, frames:__N__ };
// all timing in frames; no inline magic numbers elsewhere
const TOKENS = { rise:0.07, inF:14, stagger:2, exitStart:__EXIT__, outF:8, outStagger:1, push:0.02, barMin:0.6,
                 fontPct:__FONTPCT__, titleTopPct:0.41, barTopPct:0.62, barWPct:0.5, barHPct:0.017 };
const { clamp, EASE } = Motion, N = CONFIG.frames;
const stage = document.getElementById("stage"), title = document.getElementById("title"), bar = document.getElementById("bar");
title.style.fontSize = CONFIG.w * TOKENS.fontPct + "px"; title.style.top = CONFIG.h * TOKENS.titleTopPct + "px";
Object.assign(bar.style, { left:CONFIG.w*(1-TOKENS.barWPct)/2+"px", top:CONFIG.h*TOKENS.barTopPct+"px", width:CONFIG.w*TOKENS.barWPct+"px", height:Math.max(4,CONFIG.h*TOKENS.barHPct)+"px" });
const letters = [...CONFIG.text].map(ch => { const s=document.createElement("span"); s.textContent=ch; title.appendChild(s); return s; });

function renderFrame(f){
  const n = letters.length, rise = CONFIG.h * TOKENS.rise;
  letters.forEach((el,i)=>{
    const inP  = EASE.out(clamp((f - i*TOKENS.stagger) / TOKENS.inF));
    const outP = EASE.in (clamp((f - TOKENS.exitStart - i*TOKENS.outStagger) / TOKENS.outF));
    el.style.transform = `translateY(${(1-inP)*rise - outP*rise}px)`;
    el.style.opacity = (inP>0 && outP<1) ? 1 : 0;
  });
  const entering = EASE.out(clamp(f / (TOKENS.inF + n*TOKENS.stagger)));
  const leaving  = EASE.in (clamp((f - TOKENS.exitStart) / (TOKENS.outF + n*TOKENS.outStagger)));
  bar.style.transform = `scaleX(${TOKENS.barMin + (1-TOKENS.barMin)*(entering-leaving)})`;
  stage.style.transformOrigin = `${CONFIG.w/2}px ${CONFIG.h/2}px`;
  stage.style.transform = `scale(${1 + TOKENS.push*Math.sin(Math.PI*clamp(f/(N-1)))})`;
}
window.renderFrame = renderFrame;
const q = new URLSearchParams(location.search).get("t");
renderFrame(q===null ? 0 : Math.round(parseFloat(q)*CONFIG.fps));
if(q===null){ let s=null; (function L(ts){ s??=ts; renderFrame(Math.floor((ts-s)/1000*CONFIG.fps)%N); requestAnimationFrame(L); })(0); } // live preview only
</script>
